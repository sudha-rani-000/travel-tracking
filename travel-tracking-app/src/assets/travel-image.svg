    <rect x="20" y="0" width="20" height="12" rx="3" fill="#16a34a"/>
    <rect x="6" y="26" width="48" height="6" fill="#15803d"/>
    <circle cx="8" cy="56" r="4" fill="#374151"/>
    <circle cx="52" cy="56" r="4" fill="#374151"/>
  </g>

  <!-- Location pin -->
  <g transform="translate(90,140)">
    <path d="M12 0 C4 0 0 6 0 13 C0 22 12 38 12 38 C12 38 24 22 24 13 C24 6 20 0 12 0 Z" fill="#ef4444"/>
