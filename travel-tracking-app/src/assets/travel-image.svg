  <!-- Road -->
  <rect x="0" y="195" width="300" height="14" fill="#9ca3af"/>
  <rect x="10" y="200" width="14" height="4" fill="#f3f4f6"/>
  <rect x="45" y="200" width="14" height="4" fill="#f3f4f6"/>
  <rect x="80" y="200" width="14" height="4" fill="#f3f4f6"/>
  <rect x="115" y="200" width="14" height="4" fill="#f3f4f6"/>
  <rect x="150" y="200" width="14" height="4" fill="#f3f4f6"/>
  <rect x="185" y="200" width="14" height="4" fill="#f3f4f6"/>
  <rect x="220" y="200" width="14" height="4" fill="#f3f4f6"/>
  <rect x="255" y="200" width="14" height="4" fill="#f3f4f6"/>

  <!-- Cloud -->
